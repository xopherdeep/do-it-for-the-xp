name: Tests

# The full gate on GitHub instead of on a laptop, through Chemical X. Every push to master runs
# `chemx verify` (audit against chemx-ratchet.json, typecheck and the whole jest suite) and `chemx lint`.
# Pull requests run the same lint, audit and typecheck over the whole project, but only the jest specs
# that depend on the files the PR changed (tools/ci/pr-specs.mjs); master's full run catches the rest. To block merging on a red run, mark the Verify check as
# required in the repo's branch protection settings for master. Bump CHEMX_VERSION to move CI to a newer chemx.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHEMX_VERSION: 26.10.29-360

jobs:
  # One job, one checkout and one install: Lint runs first so a lint error fails fast, then Verify.
  # The job keeps the name Verify because master's branch protection requires a check by that name.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Depth 2 so a PR's merge commit keeps its first parent (the base tip) to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Jest's transform cache (ts-jest, vue-jest, babel), so unchanged files skip recompiling. Saved under a new key
      # every run and restored from the newest one; the vue transform keys on `src=` files so nothing goes stale.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'jest.config.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'jest.config.json', 'tsconfig.json') }}-

      # The chemx package npx downloads, so it isn't fetched again on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-chemx-${{ runner.os }}-${{ env.CHEMX_VERSION }}

      - name: Lint
        run: npx --yes "chemx@$CHEMX_VERSION" lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify
        if: github.event_name != 'pull_request'
        run: npx --yes "chemx@$CHEMX_VERSION" verify
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # `chemx verify --changed` would also narrow the audit to the changed files, which swaps the ratchet
      # gate for a severity gate, so a PR runs the three parts itself: whole audit, whole typecheck, related specs.
      - name: Audit
        if: github.event_name == 'pull_request'
        run: npx --yes "chemx@$CHEMX_VERSION" audit --no-index

      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: npx --yes "chemx@$CHEMX_VERSION" typecheck

      - name: Related tests
        if: github.event_name == 'pull_request'
        run: node tools/ci/pr-specs.mjs HEAD^1
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # The only gate that type-checks the <script> blocks of .vue files. `chemx typecheck` is plain tsc and skips them;
      # the production build's fork-ts-checker types them (three TS2339 in GeneralSettings.vue reached master unseen).
      # vue-tsc is not a dependency here, and none is added for this, so a PR runs the production build (`pnpm build`,
      # which is `ionic build`) through chemx, which groups the diagnostics. COST: a full webpack build, a few minutes
      # and about 2-5 GB, run last so lint, audit, typecheck and the related specs fail fast first. Swap this step for
      # `npx vue-tsc --noEmit` if vue-tsc is ever added to devDependencies.
      - name: Build
        if: github.event_name == 'pull_request'
        run: npx --yes "chemx@$CHEMX_VERSION" build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Browser smoke test: boots the dev server and drives a few Cypress specs (390x844) against it.
  # NOT BLOCKING while it proves itself: `continue-on-error: true` keeps a flaky run from turning master red.
  # It runs on pushes to master and on manual dispatch only (a dev server plus Cypress costs several GB and minutes).
  # TO MAKE IT A GATE once it has been green for a couple of weeks: delete `continue-on-error`, then (optionally)
  # drop the `if:` so it also runs on pull requests, and mark "E2E smoke" as a required check in branch protection.
  e2e-smoke:
    name: E2E smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cypress downloads its binary in the package's postinstall (allowed in pnpm-workspace.yaml). The binary is
      # cached across runs; `cypress install` below is a no-op on a cache hit and a download on a miss.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Cypress binary
        run: pnpm exec cypress install

      - name: Start the dev server
        run: |
          nohup pnpm serve --no-open > dev-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8100 > /dev/null; then echo "dev server up after about $((i * 5))s"; exit 0; fi
            sleep 5
          done
          echo "dev server did not answer on :8100"; tail -n 50 dev-server.log; exit 1
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=6144

      # One cypress run per spec so a failure names the spec; all three run even if an earlier one fails.
      # `--browser chrome` (Google Chrome ships on the ubuntu runner image) instead of Cypress 8.7's bundled Electron 93:
      # three.js 0.186 uses class static blocks (ES2022, Chromium 94+) and Vue CLI leaves node_modules untranspiled,
      # so Electron 93 throws "Unexpected token '{'" in chunk-vendors.js and every spec fails. Local runs need the same flag.
      - name: Spec new-hero
        run: pnpm vue-cli-service test:e2e --headless --browser chrome --url http://localhost:8100 --spec tests/e2e/specs/new-hero.spec.js
      - name: Spec battle
        if: ${{ !cancelled() }}
        run: pnpm vue-cli-service test:e2e --headless --browser chrome --url http://localhost:8100 --spec tests/e2e/specs/battle.spec.js
      - name: Spec quest beast card
        if: ${{ !cancelled() }}
        run: pnpm vue-cli-service test:e2e --headless --browser chrome --url http://localhost:8100 --spec tests/e2e/specs/quest-detail-fab.spec.js

      - name: Upload screenshots and server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: |
            tests/e2e/screenshots
            tests/e2e/videos
            dev-server.log
          if-no-files-found: ignore
          retention-days: 7
