name: Tests

# The full gate on GitHub instead of on a laptop, through Chemical X: `chemx verify` (audit against
# chemx-ratchet.json, typecheck and the whole jest suite) and `chemx lint` run in one job on every
# pull request and on every push to master. To block merging on a red run, mark the Verify check as
# required in the repo's branch protection settings for master. Bump CHEMX_VERSION to move CI to a newer chemx.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHEMX_VERSION: 26.10.10-75

jobs:
  # One job, one checkout and one install: Lint runs first so a lint error fails fast, then Verify.
  # The job keeps the name Verify because master's branch protection requires a check by that name.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx --yes "chemx@$CHEMX_VERSION" lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify
        run: npx --yes "chemx@$CHEMX_VERSION" verify
        env:
          NODE_OPTIONS: --max-old-space-size=6144
