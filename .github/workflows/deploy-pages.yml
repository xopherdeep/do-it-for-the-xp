name: Deploy to Cloudflare Pages

# Every push to master builds the app and uploads dist/ to the Cloudflare Pages project
# do-it-for-the-xp (custom domains app.forthexp.com and app.doit.forthexp.com).
# Needs the repo secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and the repo
# variable CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-deploy-master
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # The build's version is YY.M.D-MINS (UTC date, minutes since midnight UTC), the same shape the
      # old auto-bump commits used. It is stamped into package.json in this checkout only and never
      # committed: master is protected (Verify required), so a bot push to it is refused. The app reads
      # the version from package.json at build time (vue.config.js, the start page, Support).
      - name: Stamp the version
        id: version
        run: |
          version="$(date -u +%y.%-m.%-d)-$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Check the bundle ships no source maps or API keys
        run: |
          maps=$(find dist -name '*.map' | wc -l)
          keys=$(grep -rlE 'AIza[0-9A-Za-z_-]{35}' dist | wc -l || true)
          echo "source maps: $maps, Google API keys: $keys"
          test "$maps" -eq 0
          test "$keys" -eq 0

      - name: Deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        # wrangler-action installs Wrangler with the repo's package manager, which pnpm refuses here,
        # so call Wrangler 4 through npx like the manual deploys do.
        run: npx --yes wrangler@4 pages deploy dist --project-name do-it-for-the-xp --branch master --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Tags are not covered by the master protection, so the deployed commit still gets its vYY.M.D-MINS tag.
      - name: Tag the deployed commit
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        continue-on-error: true
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Explain a skipped deploy
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::warning::Built but not deployed - add the CLOUDFLARE_API_TOKEN repo secret."
