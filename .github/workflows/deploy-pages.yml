name: Deploy to Cloudflare Pages

# Every push to master builds the app and uploads dist/ to the Cloudflare Pages project
# do-it-for-the-xp (custom domains app.forthexp.com and app.doit.forthexp.com).
# Needs the repo secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and the repo
# variable CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_run:
    workflows: ["Autobump"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying version $version"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Check the bundle ships no source maps or API keys
        run: |
          maps=$(find dist -name '*.map' | wc -l)
          keys=$(grep -rlE 'AIza[0-9A-Za-z_-]{35}' dist | wc -l || true)
          echo "source maps: $maps, Google API keys: $keys"
          test "$maps" -eq 0
          test "$keys" -eq 0

      - name: Deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        # wrangler-action installs Wrangler with the repo's package manager, which pnpm refuses here,
        # so call Wrangler 4 through npx like the manual deploys do.
        run: |
          commit_hash=$(git rev-parse HEAD)
          target_branch="${{ github.event.workflow_run.head_branch || 'master' }}"
          npx --yes wrangler@4 pages deploy dist --project-name do-it-for-the-xp --branch "$target_branch" --commit-hash "$commit_hash"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Explain a skipped deploy
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::warning::Built but not deployed - add the CLOUDFLARE_API_TOKEN repo secret."
